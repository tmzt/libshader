[package]
name = "libshader"
description = "Shared GPU data layouts (the instance and frame headers) and build-time WGSL validation for renderers"
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"
build = "build.rs"

[dependencies]
bytemuck = { version = "1.23.2", features = ["derive"] }
glam = "0.33"
naga = { version = "30.0.1", features = ["wgsl-in"] }

[build-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in"] }
